baseURL = "https://cctv-blog-render.onrender.com/"
languageCode = "en-gb"
title = "CCTV Systems UK | Expert Security Guides 2026"
theme = "PaperMod"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true
disableHugoGeneratorInject = true

[services]
  [services.googleAnalytics]
    id = ""

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "CCTV Systems UK | Expert Security Guides 2026"
  description = "Authoritative guides to CCTV installation, security systems, and compliance for UK businesses and homes in 2026. Expert advice from Gary Pearce."
  keywords = ["CCTV UK", "security cameras", "CCTV installation", "UK security systems", "CCTV compliance", "GDPR CCTV"]
  author = "Gary Pearce"
  DateFormat = "2 January 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = true
  ShowReadingTime = true
  displayFullLangName = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  MainSections = ["posts"]
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  [params.assets]
    disableHLJS = true
    disableFingerprinting = true

  [params.label]
    text = "CCTV Systems UK"
    icon = "🛡️"
    iconHeight = 35

  [params.homeInfoParams]
    Title = "Expert CCTV & Security Guides for 2026"
    Content = "Authoritative, up-to-date guides on CCTV installation, security systems, and compliance across the UK. Written by Gary Pearce — NSI/SSAIB certified installer with years of hands-on experience across Newcastle, Durham, Sunderland, Middlesbrough, and beyond."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/gazpearce"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:info@hardwire.uk"

[menu]
  [[menu.main]]
    identifier = "guides"
    name = "Guides"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 2

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true
  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true
  [privacy.instagram]
    disabled = false
    simple = true
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = true
