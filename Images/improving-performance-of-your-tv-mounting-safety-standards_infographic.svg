<svg viewBox="0 0 800 400" width="100%" height="auto" style="border-radius:16px; border:1px solid #e2e8f0; background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family:'Inter',system-ui,sans-serif; margin: 2.5rem 0; box-shadow: 0 20px 40px rgba(15,23,42,0.15);">
